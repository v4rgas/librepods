name: notify-archrepo

# Tell v4rgas/archrepo to rebuild librepods-v4rgas-rust-git as soon as this
# branch moves, instead of waiting for its hourly poll.

on:
  push:
    branches: [linux/rust]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger archrepo build
        env:
          GH_TOKEN: ${{ secrets.ARCHREPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ARCHREPO_TOKEN secret is not set; archrepo's hourly poll will catch this."
            exit 0
          fi
          gh api repos/v4rgas/archrepo/dispatches \
            -f event_type=source-updated \
            -f 'client_payload[sha]=${{ github.sha }}'
